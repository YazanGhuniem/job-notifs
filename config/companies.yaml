# Companies to watch.
#
# Every entry below was probed live and returned real postings — the number in
# the comment is how many total reqs its board had when this was built.
#
# To add a company:   python tools/discover.py "Company Name"
# To pause one:       add `enabled: false`
#
# ats types: greenhouse | ashby | lever | workday | smartrecruiters
#            | amazon | eightfold | uber | microsoft

companies:

  # ---------------------------------------------------------------- big tech
  amazon:
    name: Amazon
    ats: amazon           # covers AWS, Amazon Robotics, Audible, Twitch corp

  microsoft:
    name: Microsoft
    ats: microsoft
    # Unverified: this endpoint was unreachable from the machine that built
    # this (local network egress, not a bad URL). If it's wrong you'll get a
    # "microsoft has failed 5 runs" alert instead of silent failure.

  nvidia:
    name: NVIDIA          # 914 intern-matching reqs
    ats: workday
    host: nvidia.wd5.myworkdayjobs.com
    tenant: nvidia
    site: NVIDIAExternalCareerSite

  netflix:
    name: Netflix
    ats: eightfold
    host: explore.jobs.netflix.net
    domain: netflix.com

  uber:
    name: Uber
    ats: uber

  stripe:      {name: Stripe,      ats: greenhouse, token: stripe}       # 536
  databricks:  {name: Databricks,  ats: greenhouse, token: databricks}   # 800
  snowflake:   {name: Snowflake,   ats: ashby,      token: snowflake}    # 400
  airbnb:      {name: Airbnb,      ats: greenhouse, token: airbnb}       # 196
  coinbase:    {name: Coinbase,    ats: greenhouse, token: coinbase}     # 156
